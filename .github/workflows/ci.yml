name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: simon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_WRITE_URL: postgresql+psycopg://postgres:localdev@localhost:5432/simon_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install deps
        run: uv sync --frozen --group dev

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Unit tests
        run: uv run pytest -m "not integration"

      - name: Integration tests
        run: uv run pytest -m integration
