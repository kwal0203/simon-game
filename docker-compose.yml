services:
  db:
    image: postgres:16
    container_name: simon-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: simon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simon"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: simon-api
    environment:
      DATABASE_READ_URL: ${DATABASE_READ_URL}
      DATABASE_WRITE_URL: ${DATABASE_WRITE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: ops/nginx/Dockerfile
    container_name: simon-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - api

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrate
    container_name: simon-migrate
    environment:
      DATABASE_WRITE_URL: ${DATABASE_WRITE_URL}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: no

  redis:
    image: redis:7-alpine
    container_name: simon-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
