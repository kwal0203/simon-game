services:
  db:
    image: postgres:16
    container_name: simon-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: simon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simon"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: simon-api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:localdev@db:5432/simon
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: ops/nginx/Dockerfile
    container_name: simon-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - api

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrate
    container_name: simon-migrate
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:localdev@db:5432/simon
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: no

volumes:
  postgres_data:
